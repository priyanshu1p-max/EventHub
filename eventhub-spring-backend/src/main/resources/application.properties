spring.application.name=eventhub-spring-backend

spring.datasource.url=jdbc:mysql://localhost:3306/event-hub-spring
spring.datasource.username=root       
spring.datasource.password=pc@12345

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


#smtp email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# EventHub sender details
eventhub.mail.from=${MAIL_USERNAME:}


# Event poster storage directory
eventhub.upload-dir=uploads/events

# Maximum upload size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB



# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}